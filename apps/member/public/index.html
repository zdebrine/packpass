<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The web member app (docs/TECH_SPEC.md §1). Expo fills in the title, lang, scripts and styles on export. -->
    <meta name="description" content="Book dog classes across Austin, matched to your dog. Your PackPass membership, in the browser." />
    <meta name="theme-color" content="#0e0f0e" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PackPass" />
    <meta property="og:title" content="PackPass" />
    <meta property="og:description" content="Book dog classes across Austin, matched to your dog." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The react-native-web recommended reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #e4e4e1;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #050605;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to use PackPass.</noscript>
    <div id="root"></div>
  </body>
</html>
